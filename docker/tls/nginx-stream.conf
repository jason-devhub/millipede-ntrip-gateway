# Terminaison TLS TCP (NTRIP) → backend en clair sur le réseau Docker uniquement.
# Copié dans l’image `ntrip-tls` au build (voir docker/tls/Dockerfile).

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream-access.log basic;

    upstream ntrip_backend {
        server millipede:2101;
    }

    server {
        listen 2101 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        proxy_pass ntrip_backend;
        proxy_connect_timeout 60s;
        proxy_timeout 7d;
    }
}
