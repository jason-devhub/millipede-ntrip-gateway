services:
  millipede:
    build: .
    container_name: millipede
    restart: unless-stopped
    environment:
      # Format: client_id:token,client_id2:token2
      NTRIP_AUTH_TOKENS: ${NTRIP_AUTH_TOKENS:-}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket as S;s=S.create_connection(('127.0.0.1',2101),5);s.sendall(b'GET /healthz HTTP/1.0\r\nHost:127.0.0.1\r\n\r\n');d=s.recv(256);s.close();exit(0 if b'200' in d and b'OK' in d else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    ports:
      - "2101:2101"
