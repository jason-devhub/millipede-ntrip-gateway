# Déploiement Millipede + passerelle NTRIP + terminaison TLS (TCP).
#
# Architecture :
#   - `millipede` : passerelle NTRIP en clair sur le port 2101 **uniquement**
#     sur le réseau Docker (non publié sur l’hôte). `NTRIP_ALLOW_PLAINTEXT=1`
#     est volontaire ici : le trafic Internet arrive chiffré jusqu’à
#     `ntrip-tls`, pas jusqu’au rover en clair sur le WAN (V-02).
#   - `ntrip-tls` : nginx (module stream) écoute en **TLS** sur le port publié
#     et relaie en TCP vers `millipede:2101`.
#
# Certificats : placez `fullchain.pem` et `privkey.pem` dans le répertoire
# défini par `NTRIP_TLS_CERT_DIR` (défaut `./certs`). Exemple auto-signé :
#   mkdir -p certs && openssl req -x509 -nodes -newkey rsa:4096 -days 365 \
#     -keyout certs/privkey.pem -out certs/fullchain.pem \
#     -subj "/CN=ntrip.example.org"
#
# Variables utiles : `NTRIP_TLS_PORT` (port hôte TLS, défaut 2101),
# `NTRIP_TLS_CERT_DIR` (dossier des PEM montés dans le conteneur TLS).

networks:
  ntrip:

services:
  millipede:
    build:
      context: .
      args:
        DEBIAN_TAG: bookworm-20260505-slim
        MILLIPEDE_COMMIT: 3c8b64cfdc776a253794172e93ea3cc1b9ca4509
    image: millipede-ntrip-gateway:local
    container_name: millipede
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=16m,mode=1777,nosuid,nodev,noexec
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
          pids: 256
    networks:
      - ntrip
    # Pas de publication sur l’hôte : seul ntrip-tls expose le port TLS.
    expose:
      - "2101"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      NTRIP_AUTH_TOKENS: ${NTRIP_AUTH_TOKENS:-}
      # Trafic clair limité au réseau Docker vers ntrip-tls (TLS côté client).
      NTRIP_ALLOW_PLAINTEXT: "1"
      NTRIP_AUTH_LOG_IP_ANONYMIZE: ${NTRIP_AUTH_LOG_IP_ANONYMIZE:-0}
      NTRIP_AUTH_MAX_CONNECTIONS: ${NTRIP_AUTH_MAX_CONNECTIONS:-200}
      NTRIP_AUTH_RL_MAX_FAILS: ${NTRIP_AUTH_RL_MAX_FAILS:-10}
      NTRIP_AUTH_RL_LOCKOUT: ${NTRIP_AUTH_RL_LOCKOUT:-300}
      NTRIP_AUTH_HEADER_DEADLINE: ${NTRIP_AUTH_HEADER_DEADLINE:-5}
    # secrets:
    #   - source: clients_auth
    #     target: clients_auth
    #     mode: 0400
    #     uid: "10001"
    #     gid: "10001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--timeout=3",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2101/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  ntrip-tls:
    image: nginx:1.27-alpine
    container_name: ntrip-tls
    restart: unless-stopped
    depends_on:
      millipede:
        condition: service_healthy
    networks:
      - ntrip
    ports:
      - "${NTRIP_TLS_PORT:-2101}:2101"
    volumes:
      - ./docker/tls/nginx-stream.conf:/etc/nginx/nginx.conf:ro
      - ${NTRIP_TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      # Vérifie que la config stream + certificats se chargent (TLS opérationnel).
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# secrets:
#   clients_auth:
#     file: ./secrets/clients.auth
