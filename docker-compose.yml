# Déploiement Millipede — passerelle NTRIP avec terminaison TLS via Traefik.
#
# Architecture :
#   Internet ──TLS TCP──▶ Traefik (Coolify, port NTRIP_TLS_PORT)
#                              ──TCP clair──▶ millipede:2101 (réseau Docker)
#
# Traefik gère les certificats Let's Encrypt automatiquement (renouvellement
# inclus). Plus besoin de service ntrip-tls ni de certificats manuels.
#
# Prérequis (une seule fois dans Coolify) :
#   Server → Proxy → ajouter l'entrypoint TCP "ntrip" sur le port NTRIP_TLS_PORT
#   (défaut 2101) dans la configuration statique de Traefik.
#
# Variables :
#   NTRIP_DOMAIN      — nom de domaine exposé (ex. ntrip.example.org) [obligatoire]
#   NTRIP_TLS_PORT    — port hôte TCP/TLS (défaut 2101)

networks:
  ntrip:
  coolify:
    external: true   # réseau Traefik géré par Coolify

services:
  millipede:
    build:
      context: .
      args:
        DEBIAN_TAG: bookworm-20260505-slim
        MILLIPEDE_COMMIT: 3c8b64cfdc776a253794172e93ea3cc1b9ca4509
    image: millipede-ntrip-gateway:local
    container_name: millipede
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,size=16m,mode=1777,nosuid,nodev,noexec
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    mem_limit: 512m
    mem_reservation: 128m
    pids_limit: 256
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
          pids: 256
    networks:
      - ntrip
      - coolify   # Traefik doit pouvoir joindre le conteneur
    expose:
      - "2101"
    labels:
      - "traefik.enable=true"
      # Routeur TCP avec terminaison TLS (SNI = NTRIP_DOMAIN)
      - "traefik.tcp.routers.ntrip.rule=HostSNI(`${NTRIP_DOMAIN}`)"
      - "traefik.tcp.routers.ntrip.entrypoints=ntrip"
      - "traefik.tcp.routers.ntrip.tls=true"
      - "traefik.tcp.routers.ntrip.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.ntrip.loadbalancer.server.port=2101"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      NTRIP_AUTH_TOKENS: ${NTRIP_AUTH_TOKENS:-}
      # Traefik termine TLS ; millipede reçoit du TCP brut depuis le réseau Docker.
      NTRIP_ALLOW_PLAINTEXT: "1"
      NTRIP_AUTH_LOG_IP_ANONYMIZE: ${NTRIP_AUTH_LOG_IP_ANONYMIZE:-0}
      NTRIP_AUTH_MAX_CONNECTIONS: ${NTRIP_AUTH_MAX_CONNECTIONS:-200}
      NTRIP_AUTH_RL_MAX_FAILS: ${NTRIP_AUTH_RL_MAX_FAILS:-10}
      NTRIP_AUTH_RL_LOCKOUT: ${NTRIP_AUTH_RL_LOCKOUT:-300}
      NTRIP_AUTH_HEADER_DEADLINE: ${NTRIP_AUTH_HEADER_DEADLINE:-5}
    # secrets:
    #   - source: clients_auth
    #     target: clients_auth
    #     mode: 0400
    #     uid: "10001"
    #     gid: "10001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--tries=1",
          "--timeout=3",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2101/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

